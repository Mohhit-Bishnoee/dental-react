services:
  - type: web
    name: everwell-dental
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: everwell-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: mansi.s0824@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/site.sqlite
